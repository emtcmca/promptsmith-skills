name: Generator or provenance problem
description: scripts/build-skills.mjs failed, produced wrong output, or the mirror stamp looks wrong.
labels: [generator]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: >-
        Include the promptsmith commit you built from and the stamp currently in the
        README if the two disagree.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Generator output
      render: shell
